<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180">
  <defs>
    <linearGradient id="appBg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff7fb"/>
      <stop offset="38%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f7f7fc"/>
    </linearGradient>
    <linearGradient id="editBg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7f7fb"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="avatar" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ff9abc"/>
      <stop offset="100%" stop-color="#ff5a7d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; }
      .title { font-size: 54px; font-weight: 850; fill: #17171c; }
      .subtitle { font-size: 25px; fill: #686875; }
      .phone-title { font-size: 41px; font-weight: 850; fill: #17171c; }
      .nav { font-size: 23px; fill: #85858f; }
      .nav-strong { font-size: 23px; font-weight: 760; fill: #17171c; }
      .muted { font-size: 21px; fill: #747480; }
      .label { font-size: 17px; fill: #8d8d98; letter-spacing: 2px; }
      .metric-value { font-size: 34px; font-weight: 830; fill: #17171c; }
      .metric-label { font-size: 18px; fill: #777783; }
      .field-label { font-size: 18px; fill: #747480; }
      .field-value { font-size: 24px; font-weight: 720; fill: #17171c; }
      .note { font-size: 23px; fill: #33333c; }
    </style>
  </defs>

  <rect width="1800" height="1180" rx="0" fill="#f3f3f7"/>
  <text x="90" y="100" class="title">联系人主页 B1：详情页 + 编辑 Sheet</text>
  <text x="90" y="145" class="subtitle">主页专注展示；点“编辑”进入表单。出生时长等指标抽成共享 display model，App 和 Widget 分别渲染。</text>

  <rect x="82" y="190" width="1636" height="890" rx="42" fill="#ffffff" opacity="0.78" stroke="#d9d9e1"/>
  <text x="178" y="270" class="subtitle" font-weight="750">查看态：联系人主页</text>
  <text x="980" y="270" class="subtitle" font-weight="750">编辑态：Sheet 表单</text>

  <g filter="url(#shadow)">
    <rect x="170" y="320" width="560" height="700" rx="58" fill="url(#appBg)" stroke="#d5d5dd"/>
  </g>
  <text x="214" y="380" class="nav">‹ 时间线</text>
  <text x="643" y="380" class="nav">编辑</text>

  <rect x="214" y="430" width="118" height="118" rx="38" fill="url(#avatar)"/>
  <text x="252" y="505" font-size="52" font-weight="840" fill="#ffffff">安</text>
  <text x="360" y="474" class="phone-title">安安</text>
  <rect x="360" y="496" width="176" height="38" rx="19" fill="#ffe8ef"/>
  <text x="383" y="521" font-size="20" font-weight="730" fill="#d12b57">女儿 · 公历</text>

  <g>
    <rect x="214" y="585" width="228" height="116" rx="28" fill="#ffffff" opacity="0.86" stroke="#dfdfe7"/>
    <text x="238" y="635" class="metric-value">2 年</text>
    <text x="238" y="674" class="metric-label">已经出生</text>

    <rect x="466" y="585" width="220" height="116" rx="28" fill="#ffffff" opacity="0.86" stroke="#dfdfe7"/>
    <text x="490" y="635" class="metric-value">365 天</text>
    <text x="490" y="674" class="metric-label">下次生日</text>

    <rect x="214" y="725" width="228" height="116" rx="28" fill="#ffffff" opacity="0.86" stroke="#dfdfe7"/>
    <text x="238" y="775" class="metric-value">2024/7/5</text>
    <text x="238" y="814" class="metric-label">出生日期</text>

    <rect x="466" y="725" width="220" height="116" rx="28" fill="#ffffff" opacity="0.86" stroke="#dfdfe7"/>
    <text x="490" y="775" class="metric-value">3 岁</text>
    <text x="490" y="814" class="metric-label">下次年龄</text>
  </g>

  <rect x="214" y="872" width="472" height="92" rx="28" fill="#17171c"/>
  <text x="238" y="907" class="label" fill="#aaaab3">WIDGET 可用卡片</text>
  <text x="238" y="941" font-size="30" font-weight="820" fill="#ffffff">出生 2 年 0 天</text>
  <text x="500" y="941" font-size="22" fill="#c9c9d1">生日还有 365 天</text>

  <g filter="url(#shadow)">
    <rect x="980" y="320" width="560" height="700" rx="58" fill="url(#editBg)" stroke="#d5d5dd"/>
  </g>
  <text x="1024" y="380" class="nav">取消</text>
  <text x="1196" y="380" class="nav-strong">编辑联系人</text>
  <text x="1465" y="380" class="nav">保存</text>

  <rect x="1024" y="430" width="472" height="198" rx="30" fill="#ffffff" opacity="0.88" stroke="#dfdfe7"/>
  <text x="1048" y="470" class="label">基本信息</text>
  <rect x="1048" y="492" width="424" height="50" rx="16" fill="#f0f0f4"/>
  <text x="1066" y="524" class="field-label">姓名</text>
  <text x="1304" y="524" class="field-value">安安</text>
  <rect x="1048" y="552" width="424" height="50" rx="16" fill="#f0f0f4"/>
  <text x="1066" y="584" class="field-label">关系 / 称谓</text>
  <text x="1304" y="584" class="field-value">女儿</text>

  <rect x="1024" y="652" width="472" height="198" rx="30" fill="#ffffff" opacity="0.88" stroke="#dfdfe7"/>
  <text x="1048" y="692" class="label">生日</text>
  <rect x="1048" y="714" width="424" height="50" rx="16" fill="#f0f0f4"/>
  <text x="1066" y="746" class="field-label">日历</text>
  <text x="1304" y="746" class="field-value">公历</text>
  <rect x="1048" y="774" width="424" height="50" rx="16" fill="#f0f0f4"/>
  <text x="1066" y="806" class="field-label">出生日期</text>
  <text x="1258" y="806" class="field-value">2024 年 7 月 5 日</text>

  <rect x="1024" y="874" width="472" height="90" rx="30" fill="#ffffff" opacity="0.88" stroke="#dfdfe7"/>
  <text x="1048" y="914" class="label">展示</text>
  <text x="1048" y="946" class="field-label">出生时长参与主页与 Widget</text>
  <rect x="1416" y="918" width="56" height="32" rx="16" fill="#ff5a7d"/>
  <circle cx="1456" cy="934" r="14" fill="#ffffff"/>

  <text x="172" y="1128" class="subtitle">保存路径：AIOutput/DesignReferences/contact-home-b1-reference.svg</text>
</svg>
