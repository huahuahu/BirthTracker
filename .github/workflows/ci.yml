name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare local Xcode config
        run: cp Config/Project.xcconfig.example Config/Project.xcconfig
      - name: Generate project
        run: xcodegen generate
      - name: Build and test
        run: |
          xcodebuild test \
            -scheme BirthTracker \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            CODE_SIGNING_ALLOWED=NO
      - name: Validate fastlane syntax
        run: bundle install && bundle exec fastlane lanes
